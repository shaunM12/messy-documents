[project]
name = "docsearch"
version = "0.1.0"
description = "Messy document search + evaluation: type-aware chunking, hybrid BM25 + dense retrieval, cited answers."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pdfplumber==0.11.10",
    "rank-bm25==0.2.2",
    "reportlab==5.0.1",
    "sentence-transformers==6.1.0",
    "typer==0.27.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
docsearch = "docsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
